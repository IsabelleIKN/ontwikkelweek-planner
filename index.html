<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ontwikkelweek-planner</title>
<style>
:root{
  --bg:#f6f5f2;--card:#fff;--ink:#1d2330;--mut:#6a7280;--line:#dcdad3;--acc:#2f5fd0;--acc-bg:#e6edfb;
  --in:#dbe8fb;--in-ink:#1c3f86;--dbl:#fde3b4;--dbl-ink:#7a4a00;--bad:#f9c9c9;--bad-ink:#8a1c1c;
  --ok:#dcf1e0;--ok-ink:#1f6a33;--off:#ebe9e4;--exc:#e9defa;--exc-ink:#4b2f86;--stu:#e4e2dc;--vn:#e0f0f0;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#15181f;--card:#1e222b;--ink:#e8eaf0;--mut:#9aa2b1;--line:#343a47;--acc:#7da2ff;--acc-bg:#25304b;
  --in:#25395e;--in-ink:#bcd2ff;--dbl:#5a4112;--dbl-ink:#ffd48a;--bad:#5e2326;--bad-ink:#ffb4b4;
  --ok:#1e3a27;--ok-ink:#a6e3b5;--off:#2a2e38;--exc:#3a2d5c;--exc-ink:#d4c2ff;--stu:#2a2d35;--vn:#1f3434;}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header.top{background:var(--card);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:20}
header.top h1{font-size:17px;margin:0;font-weight:650}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{border:0;background:none;padding:7px 13px;border-radius:8px;font:inherit;color:var(--mut);cursor:pointer}
nav button:hover{background:var(--acc-bg)}
nav button.on{background:var(--acc);color:#fff}
main{padding:18px 20px 60px;max-width:1500px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.card h2{font-size:15px;margin:0 0 4px}
.card-h{display:flex;align-items:baseline;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.muted{color:var(--mut);font-size:13px}
.row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:12px}
label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--mut)}
input,select,textarea,button{font:inherit}
input[type=text],input[type=date],input:not([type]),select,textarea{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:7px;padding:6px 9px;min-width:0}
button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
button.danger{color:var(--bad-ink)}
button.small{padding:3px 8px;font-size:13px}
.scroll{overflow-x:auto}
.weekbar{display:flex;gap:10px;align-items:flex-end;margin-bottom:14px;flex-wrap:wrap}
.weekbar select{min-width:240px}
table{border-collapse:separate;border-spacing:0;width:100%}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:top;font-size:13.5px}
th{background:var(--card);font-weight:600;text-align:left}
thead th{text-align:center;position:sticky;top:0}
table.struct td{background:var(--card)}
table.struct td select{width:100%}
table.struct td input{width:100%;margin-top:4px}
table.struct th small,table.grid th small,table.occ th small{display:block;font-weight:400;color:var(--mut)}
.t-studiedag{background:var(--stu)!important}.t-excursie{background:var(--exc)!important}.t-voornazorg{background:var(--vn)!important}
.seg{display:flex;margin-top:6px}
.seg button{border-radius:0;padding:3px 8px;font-size:12px;font-weight:400}
.seg button:first-child{border-radius:7px 0 0 7px}.seg button:last-child{border-radius:0 7px 7px 0;border-left:0}
.seg button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.chip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12.5px;border:1px solid var(--line);background:var(--card);cursor:pointer;user-select:none}
.chip.on{background:var(--acc-bg);border-color:var(--acc);color:var(--acc)}
.chip.t{cursor:default;margin:1px 2px 1px 0;background:var(--in);color:var(--in-ink);border-color:transparent;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.t.dbl{background:var(--dbl);color:var(--dbl-ink)}
.chip.t.bad{background:var(--bad);color:var(--bad-ink);font-weight:600}
.lbl{font-size:12px;color:var(--mut);margin-right:2px}
table.grid th.sticky,table.grid td.sticky,table.occ th.sticky,table.occ td.sticky{position:sticky;left:0;z-index:2;background:var(--card);min-width:110px}
table.grid thead th.sticky,table.occ thead th.sticky{z-index:3}
table.grid td.cell{min-width:118px;height:58px}
td.cell.edit{cursor:pointer}td.cell.edit:hover{outline:2px solid var(--acc);outline-offset:-2px}
td.cell.empty{background:repeating-linear-gradient(135deg,transparent 0 6px,rgba(200,120,0,.10) 6px 12px)}
td.cell .act{font-size:12px;color:var(--mut);margin-top:2px}
td.cell .none{color:var(--dbl-ink);font-size:12px}
td.cell.run{color:var(--mut);font-size:12px}
td.blk{text-align:center;color:var(--mut);font-size:13px;vertical-align:middle}
tr.grp th{background:var(--acc-bg);color:var(--acc);font-size:13px}
.badge{font-size:11.5px;font-weight:500;background:var(--card);border:1px solid var(--line);color:var(--mut);padding:1px 8px;border-radius:999px;margin-left:8px}
.prof{font-size:11px;color:var(--mut);margin-left:4px}
table.occ td.s{min-width:84px;height:44px;text-align:center;font-size:12.5px;cursor:pointer;vertical-align:middle}
table.occ td.s:hover{outline:2px solid var(--acc);outline-offset:-2px}
td.s.free{background:var(--card);color:var(--mut)}
td.s.in{background:var(--in);color:var(--in-ink)}
td.s.dbl{background:var(--dbl);color:var(--dbl-ink);font-weight:600}
td.s.bad{background:var(--bad);color:var(--bad-ink);font-weight:600}
td.s.off{background:repeating-linear-gradient(135deg,var(--off) 0 6px,transparent 6px 12px);color:var(--mut)}
td.s.extra{box-shadow:inset 0 0 0 2px var(--ok-ink)}
.flags{font-size:11px;color:var(--mut);font-weight:400}
.alert{border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:14px}
.alert.ok{background:var(--ok);color:var(--ok-ink)}
.alert.warn{background:var(--dbl);color:var(--dbl-ink)}
.alert ul{margin:6px 0 0;padding-left:18px}
.alert .kop{font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line)}
.tg{padding:2px 6px;font-size:12px;min-width:24px;border-radius:5px;background:var(--off);color:var(--mut)}
.tg.on{background:var(--ok);color:var(--ok-ink);border-color:var(--ok-ink)}
table.docs td,table.docs th{vertical-align:middle}
table.docs .dd{white-space:nowrap}
dialog{border:1px solid var(--line);border-radius:14px;padding:0;background:var(--card);color:var(--ink);max-width:560px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(0,0,0,.4)}
.dlg{padding:18px 20px;max-height:80vh;overflow:auto}
.dlg h3{margin:0 0 4px;font-size:16px}
.dlg .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.tl{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:8px;border:1px solid transparent}
.tl:hover{background:var(--acc-bg)}
.tl .st{margin-left:auto;font-size:12.5px;color:var(--mut)}
.tl.dbl .st{color:var(--dbl-ink)}.tl.bad .st{color:var(--bad-ink)}.tl.off .st{color:var(--mut);font-style:italic}.tl.free .st{color:var(--ok-ink)}
.radio{display:flex;gap:8px;align-items:flex-start;padding:6px 0}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:9px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
#toast.on{opacity:1}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.empty-state{text-align:center;padding:40px 20px;color:var(--mut)}
.printonly{display:none}
@media print{
  .noprint,header.top,#toast{display:none!important}
  .printonly{display:block}
  body{background:#fff;color:#000;font-size:11px}main{padding:0;max-width:none}
  .card{border:0;padding:0}
  th,td{font-size:10px;padding:3px 4px}
  td.cell,td.s{height:auto!important;min-width:0!important}
  thead th,table.grid th.sticky,table.grid td.sticky,table.occ th.sticky,table.occ td.sticky{position:static}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:A4 landscape;margin:9mm}
}

details.steps{border-left:4px solid var(--acc)}
details.steps summary{display:flex;align-items:center;gap:12px;cursor:pointer;list-style:none;flex-wrap:wrap}
details.steps summary::-webkit-details-marker{display:none}
details.steps summary::before{content:'▾';color:var(--mut)}
details.steps:not([open]) summary::before{content:'▸'}
details.steps summary h2{margin:0;font-size:16px}
details.steps summary .badge{margin-left:0}
details.steps ol{list-style:none;counter-reset:st;margin:12px 0 0;padding:0}
details.steps li{counter-increment:st;border-radius:10px;padding:8px 10px;margin-bottom:4px}
details.steps li label{flex-direction:row;align-items:flex-start;gap:10px;color:var(--ink);font-size:14.5px;cursor:pointer}
details.steps li label::before{content:counter(st);font-weight:650;color:var(--acc);background:var(--acc-bg);border-radius:999px;min-width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;flex:none}
details.steps li input{margin-top:5px;flex:none}
details.steps li label>span{display:flex;flex-direction:column;gap:2px}
details.steps li.next{background:var(--acc-bg)}
details.steps li.done b{color:var(--mut);text-decoration:line-through;font-weight:500}
details.steps .btns{display:flex;gap:6px;margin-top:4px}
td.s,.chip{}

.dlg .x{position:sticky;top:0;float:right;z-index:3;width:32px;height:32px;padding:0;border-radius:999px;font-size:22px;line-height:1;margin:-4px -6px 0 8px;background:var(--card)}
.dlg h3{padding-right:36px}
td.s.bw{box-shadow:inset 0 -3px 0 var(--in-ink)}
td.cell.free{background:var(--stu)!important;color:var(--mut);text-align:center;vertical-align:middle;font-size:12.5px}

.ov-head{display:flex;align-items:baseline;gap:14px;margin:4px 0 6px}.ov-head h2{margin:0;font-size:20px}
h3.gh{margin:18px 0 8px;font-size:15px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(520px,1fr));gap:12px}
.vc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;break-inside:avoid}
.vc header{display:flex;align-items:baseline;gap:6px;margin-bottom:6px;font-size:15px}
.vc table{table-layout:fixed;border-collapse:collapse;width:100%}
.vc th,.vc td{border:1px solid var(--line);padding:4px 5px;font-size:12.5px;vertical-align:middle;text-align:center}
.vc th{background:var(--off);font-weight:600}.vc th small{display:block;font-weight:400;color:var(--mut);font-size:11px}
.vc th.pl{width:44px;font-size:11px;font-weight:500;color:var(--mut)}
.vc td{height:54px}
.vc .chip.t{max-width:100%;margin:1px}
.vc .act{font-size:11px;color:var(--mut);margin-top:2px}
.vc .lab{font-weight:500;color:var(--mut)}.vc .exc-t{font-size:11.5px;color:var(--exc-ink);font-weight:600}
.vc .none{color:var(--dbl-ink);font-size:12px}
.k-les{background:var(--in)}.k-exc{background:var(--exc)}.k-studie,.k-vrij{background:var(--stu)}.k-vn{background:var(--vn)}.k-leeg{background:repeating-linear-gradient(135deg,transparent 0 6px,rgba(200,120,0,.10) 6px 12px)}
@media print{
  .cards{grid-template-columns:1fr 1fr;gap:8px}
  .vc{border:1px solid #bbb;padding:6px 8px}.vc td{height:42px}
  h3.gh{break-after:avoid;margin:10px 0 4px}
  .ov-head{margin:0 0 4px}
  .chip.t{max-width:none;font-size:10px}
}
.vc header .prof{margin-left:2px}.vc header .badge{margin-left:auto}
@media print{.vc header{font-size:13px}}

</style>
</head>
<body>
<header class="top"><h1>Ontwikkelweek-planner</h1><nav id="nav"></nav></header>
<main id="app"></main>
<dialog id="dlg"></dialog>
<input type="file" id="file" hidden>
<div id="toast" role="status"></div>
<script>
/* xlsx-lite: minimale Excel (.xlsx) schrijver en lezer zonder afhankelijkheden. Lezen gebruikt DecompressionStream (alle moderne browsers). */
const XL = (() => {
  const enc = new TextEncoder(), dec = new TextDecoder();
  const crcT = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  const crc32 = b => { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = crcT[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
  const xe = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '');
  const colName = i => { let s = ''; i++; while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; };

  // benoemde celstijlen: naam -> [lettertype, vulkleur, rand, horizontaal, verticaal]
  const NS = {
    title: [3, null, 0, 'left', 'center'], head: [2, 'FF2F5FD0', 1, 'center', 'center'], part: [1, 'FFF0EEE8', 1, 'center', 'center'], name: [1, null, 1, 'left', 'center'],
    les: [0, 'FFDBE8FB', 1, 'center', 'center'], dbl: [0, 'FFFDE3B4', 1, 'center', 'center'], bad: [0, 'FFF9C9C9', 1, 'center', 'center'],
    leeg: [4, 'FFFFF4DD', 1, 'center', 'center'], studie: [4, 'FFE4E2DC', 1, 'center', 'center'], vn: [4, 'FFE0F0F0', 1, 'center', 'center'],
    exc: [0, 'FFE9DEFA', 1, 'center', 'center'], vrij: [4, 'FFEBE9E4', 1, 'center', 'center'], run: [4, null, 1, 'center', 'center'],
    off: [4, 'FFE0DED8', 1, 'center', 'center'], free: [0, null, 1, 'center', 'center'],
  };
  const NAMED = Object.keys(NS);
  function stylesXml() {
    const fills = [...new Set(NAMED.map(n => NS[n][1]).filter(Boolean))];
    const edge = t => `<${t} style="thin"><color rgb="FFC9C6BE"/></${t}>`;
    return '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
      '<fonts count="5"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font><font><b/><sz val="14"/><name val="Calibri"/></font><font><i/><sz val="11"/><color rgb="FF6A7280"/><name val="Calibri"/></font></fonts>' +
      `<fills count="${2 + fills.length}"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill>${fills.map(c => `<fill><patternFill patternType="solid"><fgColor rgb="${c}"/><bgColor indexed="64"/></patternFill></fill>`).join('')}</fills>` +
      `<borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border><border>${edge('left')}${edge('right')}${edge('top')}${edge('bottom')}<diagonal/></border></borders>` +
      '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
      `<cellXfs count="${3 + NAMED.length}"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment vertical="top"/></xf>` +
      NAMED.map(n => { const [fo, fi, bo, h, v] = NS[n]; return `<xf numFmtId="0" fontId="${fo}" fillId="${fi ? 2 + fills.indexOf(fi) : 0}" borderId="${bo}" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="${h}" vertical="${v}" wrapText="1"/></xf>`; }).join('') +
      '</cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>';
  }

  function zipStore(files) { // files: [{name, data(Uint8Array)}]
    const parts = [], cen = []; let off = 0;
    const u16 = v => new Uint8Array([v & 255, (v >> 8) & 255]);
    const u32 = v => new Uint8Array([v & 255, (v >> 8) & 255, (v >> 16) & 255, (v >>> 24) & 255]);
    const cat = arr => { const n = arr.reduce((a, b) => a + b.length, 0); const o = new Uint8Array(n); let p = 0; for (const a of arr) { o.set(a, p); p += a.length; } return o; };
    for (const f of files) {
      const nm = enc.encode(f.name), crc = crc32(f.data);
      const lh = cat([u32(0x04034b50), u16(20), u16(0x0800), u16(0), u16(0), u16(0x21), u32(crc), u32(f.data.length), u32(f.data.length), u16(nm.length), u16(0), nm]);
      parts.push(lh, f.data);
      cen.push(cat([u32(0x02014b50), u16(20), u16(20), u16(0x0800), u16(0), u16(0), u16(0x21), u32(crc), u32(f.data.length), u32(f.data.length), u16(nm.length), u16(0), u16(0), u16(0), u16(0), u32(0), u32(off), nm]));
      off += lh.length + f.data.length;
    }
    const cd = cat(cen);
    return cat([...parts, cd, u32(0x06054b50), u16(0), u16(0), u16(files.length), u16(files.length), u32(cd.length), u32(off), u16(0)]);
  }

  // sheets: [{name, rows: [[cell,...]], widths?: [n,...], headerRows?: n}]
  function write(sheets) {
    const f = (name, txt) => ({ name, data: enc.encode(txt) });
    const H = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';
    const files = [
      f('[Content_Types].xml', H + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' + sheets.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('') + '</Types>'),
      f('_rels/.rels', H + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'),
      f('xl/workbook.xml', H + '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>' + sheets.map((s, i) => `<sheet name="${xe(s.name.slice(0, 31))}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('') + '</sheets></workbook>'),
      f('xl/_rels/workbook.xml.rels', H + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' + sheets.map((_, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('') + `<Relationship Id="rId${sheets.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`),
      f('xl/styles.xml', H + stylesXml()),
    ];
    sheets.forEach((s, i) => {
      const hr = s.headerRows ?? 1;
      let x = H + '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">';
      if (s.landscape) x += '<sheetPr><pageSetUpPr fitToPage="1"/></sheetPr>';
      if (s.widths) x += '<cols>' + s.widths.map((w, j) => `<col min="${j + 1}" max="${j + 1}" width="${w}" customWidth="1"/>`).join('') + '</cols>';
      x += '<sheetData>';
      s.rows.forEach((r, ri) => {
        const ht = s.heights && s.heights[ri];
        x += `<row r="${ri + 1}"${ht ? ` ht="${ht}" customHeight="1"` : ''}>`;
        r.forEach((cv, ci) => {
          const o = cv && typeof cv === 'object' ? cv : { v: cv }, v = o.v;
          const empty = v === null || v === undefined || v === '';
          if (empty && !o.s) return;
          const ref = colName(ci) + (ri + 1), st = o.s ? NAMED.indexOf(o.s) + 3 : (ri < hr || ci === 0 ? 1 : 0);
          if (empty) x += `<c r="${ref}" s="${st}"/>`;

<script>
/* Ontwikkelweek-planner — data blijft in deze browser (localStorage); delen gaat via export. */
const DAYS = ['ma', 'di', 'wo', 'do', 'vr'];
const DAYNAMES = { ma: 'Maandag', di: 'Dinsdag', wo: 'Woensdag', do: 'Donderdag', vr: 'Vrijdag' };
const PARTS = ['o', 'm'];
const PARTNAME = { o: 'Ochtend', m: 'Middag' };
const PARTTIME = { o: '10:00–12:15', m: '12:45–15:00' };
const PROFILES = ['WEB', 'GD', 'XR'];
const TYPES = { onderwijs: 'Onderwijs', studiedag: 'Studiedag', excursie: 'Excursie', voornazorg: 'Voor-/nazorg' };
const REDENEN = ['Cursus', 'Verplichting', 'Compensatie vrij', 'Ziek/afwezig', 'Anders'];
const KEY = 'ontwikkelweek-planner-v1';
const TAGS = ['AVO', 'WEB', 'AI', 'XR', 'GD']; // rol/richting van een docent
const tagBadges = t => (t.tags || []).map(g => `<span class="badge" style="margin-left:4px">${g}</span>`).join('');
// Structuur (rooster doorlopend/aangepast, dagtypes) geldt per groep: jaar 1 gedeeld, jaar 2 en 3 per profiel
const GROUPS = ['1', '2-WEB', '2-GD', '2-XR', '3-WEB', '3-GD', '3-XR'];
const gk = c => c.year === 1 ? '1' : c.year + '-' + c.profile;
const gYear = g => +g[0];
const gLabel = g => g === '1' ? 'Jaar 1 (gedeeld)' : `Jaar ${g[0]} · ${g.slice(2)}`;
const gShort = g => g === '1' ? 'J1' : 'J' + g[0] + ' ' + g.slice(2);

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 9);

let S, ui = { tab: 'week', modal: null, filter: { tags: [], free: false } };

/* ---------- state ---------- */
function fresh() { return { v: 1, teachers: [], classes: [], weeks: [], cur: null }; }
function load() { try { const r = localStorage.getItem(KEY); if (r) return JSON.parse(r); } catch (e) { } return null; }
let saveWarned = false;
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { if (!saveWarned) { saveWarned = true; toast('Let op: opslaan in de browser lukt niet. Exporteer regelmatig een JSON-bestand.'); } } }
function normalize(s) {
  s = s && typeof s === 'object' ? s : fresh();
  s.teachers = s.teachers || []; s.classes = s.classes || []; s.weeks = s.weeks || [];
  s.teachers.forEach(t => { t.tags = Array.isArray(t.tags) ? t.tags.filter(x => TAGS.includes(x)) : (t.avo ? ['AVO'] : []); delete t.avo; t.avail = t.avail || {}; DAYS.forEach(d => { t.avail[d] = t.avail[d] || { o: true, m: true }; }); });
  s.classes.forEach(c => { delete c.vast; c.profile = c.profile || (c.year === 1 ? 'gedeeld' : 'WEB'); });
  s.weeks.forEach(w => {
    w.mode = w.mode || {}; w.dt = w.dt || {};
    GROUPS.forEach(g => { // oudere data had alleen per jaar een structuur: die kopiëren we naar de profielen
      const y = String(gYear(g));
      if (!w.mode[g]) w.mode[g] = w.mode[y] || 'aangepast';
      if (!w.dt[g]) w.dt[g] = w.dt[y] ? JSON.parse(JSON.stringify(w.dt[y])) : {};
      DAYS.forEach(d => { w.dt[g][d] = w.dt[g][d] || { type: 'onderwijs', label: '' }; });

  return s;
}
function newTeacher(name) { const avail = {}; DAYS.forEach(d => avail[d] = { o: true, m: true }); return { id: uid(), name, avail, tags: [] }; }
function newClass(name, year, profile) { return { id: uid(), name, year, profile: year === 1 ? 'gedeeld' : (profile || 'WEB') }; }
function newWeek(label) {
  const dt = {}, mode = {};
  GROUPS.forEach(g => { mode[g] = 'aangepast'; dt[g] = {}; DAYS.forEach(d => { dt[g][d] = { type: d === 'ma' ? 'studiedag' : d === 'vr' ? 'voornazorg' : 'onderwijs', label: '' }; }); });

}
const T = id => S.teachers.find(t => t.id === id);
const C = id => S.classes.find(c => c.id === id);
const curWeek = () => S.weeks.find(w => w.id === S.cur) || null;
const cmpClass = (a, b) => a.year - b.year || a.name.localeCompare(b.name, 'nl', { numeric: true });
const cmpName = (a, b) => a.name.localeCompare(b.name, 'nl');
const cellKey = (c, d, p) => `${c}|${d}|${p}`;
const isFree = (w, c, d, p) => { const k = w.cells[cellKey(c.id, d, p)]; return !!(k && k.free); }; // klas heeft vrij volgens het normale rooster

function dateOf(w, d) {

/* ---------- planning-logica ---------- */
const isTeamDay = (w, d) => GROUPS.every(g => w.dt[g][d].type === 'studiedag');
function teachState(w, t, d, p) {
  if (isTeamDay(w, d)) return { ok: false, why: 'Teamstudiedag' };
  const o = w.ovr[`${t.id}|${d}|${p}`];
  if (o && o.s === 'nee') return { ok: false, why: o.r || 'Niet beschikbaar', n: o.n, ovr: true };
  if (o && o.s === 'ja') return { ok: true, why: 'Extra beschikbaar', ovr: true, extra: true };
  return t.avail[d][p] ? { ok: true } : { ok: false, why: 'Werkt dan niet' };
}
// docenten van een klas in een dagdeel
function classTeachers(w, c, d, p) {
  const ty = w.dt[gk(c)][d].type;
  if (ty === 'studiedag' || ty === 'voornazorg' || isFree(w, c, d, p)) return { ids: [] };
  const cell = w.cells[cellKey(c.id, d, p)];
  return { ids: cell ? cell.t.filter(id => T(id)) : [] };
}

  const res = [];
  for (const c of S.classes) {
    const ct = classTeachers(w, c, d, p);
    if (ct.ids.includes(tid)) res.push({ cls: c, exc: w.dt[gk(c)][d].type === 'excursie' });

}
function slot(w, t, d, p) {
  const st = teachState(w, t, d, p), as = assignments(w, t.id, d, p);
  // dubbele inzet kan bewust zijn (bijv. een gezamenlijke les): dan geen waarschuwing
  const bewust = as.length > 1 && !!(w.okdbl && w.okdbl[`${t.id}|${d}|${p}`]);
  const level = !st.ok ? (as.length ? 'bad' : 'off') : (as.length > 1 && !bewust) ? 'dbl' : as.length ? 'in' : 'free';
  return { st, as, level, bewust };
}
function issues(w) {
  const list = [], teachers = [...S.teachers].sort(cmpName);
  for (const t of teachers) for (const d of DAYS) for (const p of PARTS) {
    const s = slot(w, t, d, p);
    if (s.level === 'bad') list.push({ k: 'bad', t: t.id, d, p, txt: `${t.name} · ${DAYNAMES[d]} ${PARTNAME[p].toLowerCase()}: ingezet terwijl niet beschikbaar (${s.st.why}) bij ${s.as.map(a => a.cls.name).join(', ')}` });

  }

  for (const c of S.classes) {
    if (w.hidden[c.id]) continue;
    for (const d of DAYS) for (const p of PARTS) {
      const ty = w.dt[gk(c)][d].type;
      if ((ty === 'excursie' || (ty === 'onderwijs' && w.mode[gk(c)] === 'aangepast')) && !isFree(w, c, d, p) && !classTeachers(w, c, d, p).ids.length) empty++;
    }
  }
  return { list, empty };
}
const teachableDay = (w, d) => GROUPS.some(g => ['onderwijs', 'excursie'].includes(w.dt[g][d].type));

/* ---------- UI helpers ---------- */
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 3200); }

/* ---------- views ---------- */
function render() {
  const tabs = [['week', 'Week'], ['bezetting', 'Bezetting'], ['overzicht', 'Overzicht'], ['docenten', 'Docenten'], ['klassen', 'Klassen'], ['delen', 'Delen & import']];
  $('#nav').innerHTML = tabs.map(([k, l]) => `<button data-a="tab" data-v="${k}" class="${ui.tab === k ? 'on' : ''}">${l}</button>`).join('');
  const w = curWeek();
  let h = '';
  if (ui.tab === 'week') h = weekBar(w) + (w ? viewWeek(w) : noWeek());
  else if (ui.tab === 'bezetting') h = weekBar(w) + (w ? viewOcc(w) : noWeek());
  else if (ui.tab === 'overzicht') h = weekBar(w) + (w ? viewOverzicht(w) : noWeek());
  else if (ui.tab === 'docenten') h = viewTeachers();

}
function noWeek() {
  const start = !S.teachers.length || !S.classes.length;
  return `<div class="card empty-state"><p><b>Nog geen ontwikkelweek.</b></p><p>${start ? 'Begin met je <a href="#" data-a="tab" data-v="docenten">docenten</a> en <a href="#" data-a="tab" data-v="klassen">klassen</a> (of laad de voorbeelddata onder Delen & import).' : 'Maak een eerste week aan.'}</p><button class="pri" data-a="newweek">+ Nieuwe week</button></div>`;
}

function alertsHtml(w) {
  const { list, empty } = issues(w);

const STEPS = [
  ['Check met de curriculumhouders of het rooster doorloopt of aangepast is, en stem de algemene invulling van de beroepsuren / inhoud af', 'Per jaarlaag en richting. Stel het rooster hieronder in bij “Structuur van de week”.'],
  ['Stel de data vast voor excursies en andere evenementen', 'Koppel ze terug naar de curriculumhouders; zij laten de moduleleiders weten dat die dag geen onderwijs is. Excursies hebben voorrang.'],

// spec van een vak (ps = ['o'], ['m'] of beide dagdelen samen)
function specPart(w, c, d, ps) {
  const g = gk(c), x = w.dt[g][d];
  if (x.type === 'studiedag') return { kind: 'studie', title: 'Studiedag' };
  if (x.type === 'voornazorg') return { kind: 'vn', title: 'Voor-/nazorg', sub: 'studenten vrij' };
  if (ps.every(p => isFree(w, c, d, p))) return { kind: 'vrij', title: 'Vrij' };
  const ids = [...new Set(ps.flatMap(p => classTeachers(w, c, d, p).ids))];
  const people = ids.map(id => { const lv = ps.map(p => slot(w, T(id), d, p).level); return { name: T(id).name, lvl: lv.includes('bad') ? 'bad' : lv.includes('dbl') ? 'dbl' : 'ok' }; });
  const cell = w.cells[cellKey(c.id, d, ps[0])], exc = x.type === 'excursie', run = x.type === 'onderwijs' && w.mode[g] === 'doorlopend';
  return { kind: exc ? 'exc' : people.length ? 'les' : run ? 'run' : 'leeg', title: exc ? '🚌 ' + (x.label || 'Excursie') : '', people, act: cell && cell.a ? cell.a : '' };
}
// één samengevoegd vak voor de hele dag, of twee dagdelen
function specDay(w, c, d) {
  const g = gk(c), x = w.dt[g][d];
  if (x.type === 'studiedag' || x.type === 'voornazorg' || (x.type === 'onderwijs' && w.mode[g] === 'doorlopend') || PARTS.every(p => isFree(w, c, d, p))) return [specPart(w, c, d, PARTS)];
  return PARTS.map(p => specPart(w, c, d, [p]));
}
const weekRange = w => w.start ? `${dateOf(w, 'ma')} – ${dateOf(w, 'vr')}` : '';
function specHtml(sp) {
  const pp = (sp.people || []).map(pe => `<span class="chip t ${pe.lvl === 'bad' ? 'bad' : pe.lvl === 'dbl' ? 'dbl' : ''}">${esc(pe.name)}</span>`).join('');

}
function viewOverzicht(w) {
  const vis = S.classes.filter(c => !w.hidden[c.id]).sort(cmpClass);

// Excel: kaartje per klas onder elkaar, met kleur
function specCell(sp) {
  const nm = (sp.people || []).map(pe => (pe.lvl === 'bad' ? '! ' : pe.lvl === 'dbl' ? '⚠ ' : '') + pe.name);
  const lines = [];
  if (sp.title) lines.push(sp.title);
  if (sp.kind === 'run') lines.push('Rooster loopt door');
  if (sp.kind === 'leeg' || (sp.kind === 'exc' && !nm.length)) lines.push('nog niemand');
  if (sp.sub) lines.push(sp.sub);
  lines.push(...nm); if (sp.act) lines.push('(' + sp.act + ')');
  const st = sp.kind === 'les' ? (sp.people.some(p => p.lvl === 'bad') ? 'bad' : sp.people.some(p => p.lvl === 'dbl') ? 'dbl' : 'les') : sp.kind;
  return { v: lines.join('\n'), s: st };
}
function overviewSheet(w) {
  const rows = [], merges = [], heights = {};
  rows.push([{ v: w.label + (weekRange(w) ? '  ·  ' + weekRange(w) : ''), s: 'title' }]); merges.push('A1:F1'); heights[0] = 26; rows.push([]);
  const breaks = []; let k = 0;
  for (const c of S.classes.filter(c => !w.hidden[c.id]).sort(cmpClass)) {
    const r0 = rows.length;
    rows.push([{ v: `${c.name}${c.year > 1 ? ' · ' + c.profile : ''}   —   ${w.mode[gk(c)] === 'doorlopend' ? 'rooster loopt door' : 'aangepast rooster'}`, s: 'title' }]); merges.push(`A${r0 + 1}:F${r0 + 1}`); heights[r0] = 22;
    rows.push([{ v: '', s: 'head' }, ...DAYS.map(d => ({ v: DAYNAMES[d] + (dateOf(w, d) ? '  ' + dateOf(w, d) : ''), s: 'head' }))]);
    const ro = [{ v: 'Ochtend', s: 'part' }], rm = [{ v: 'Middag', s: 'part' }];
    DAYS.forEach((d, i) => {
      const sp = specDay(w, c, d);
      if (sp.length === 1) { const cc = specCell(sp[0]); ro.push(cc); rm.push({ v: '', s: cc.s }); const col = String.fromCharCode(66 + i), n = rows.length + 1; merges.push(`${col}${n}:${col}${n + 1}`); }
      else { ro.push(specCell(sp[0])); rm.push(specCell(sp[1])); }
    });
    rows.push(ro); rows.push(rm);
    // rijhoogte groeit mee met het aantal regels (inclusief afgebroken lange regels)
    const nl = v => String(v || '').split('\n').reduce((n, l) => n + Math.max(1, Math.ceil(l.length / 24)), 0);
    const need = r => Math.max(...r.slice(1).map((cc, i) => { const merged = rm[i + 1].v === '' && rm[i + 1].s === cc.s && ro[i + 1] === cc; return merged ? nl(cc.v) / 2 : nl(cc.v); }), 1);
    heights[rows.length - 2] = Math.max(46, need(ro) * 15 + 8); heights[rows.length - 1] = Math.max(46, need(rm) * 15 + 8);
    rows.push([]);
    if (++k % 3 === 0) breaks.push(rows.length); // pagina-einde na elk derde kaartje
  }
  return { name: 'Weekoverzicht', rows, merges, heights, breaks, widths: [11, 24, 24, 24, 24, 24], headerRows: 0, landscape: true };
}

const parseAv = v => {
  v = String(v ?? '').toLowerCase().trim();
  if (!v || v === 'nee' || v === '-') return { o: false, m: false };
  if (/^(ja|x|1|hele|dag|true|om)$/.test(v)) return { o: true, m: true };
  return { o: /o/.test(v), m: /m/.test(v) };
};
const avStr = a => (a.o && a.m) ? 'om' : a.o ? 'o' : a.m ? 'm' : '';
function importSheets(sheets) {
  const pick = n => sheets.find(s => s.name.toLowerCase() === n);
  const ts = pick('docenten') || sheets[0], ks = pick('klassen');
  let nt = 0, nc = 0;
  if (ts && ts.rows.length) {
    const head = (ts.rows[0] || []).map(x => String(x ?? '').toLowerCase().trim());
    const ni = head.findIndex(x => ['naam', 'docent', 'name'].includes(x)), hasHead = ni >= 0 || head.some(x => DAYS.includes(x.slice(0, 2)));
    const nameCol = ni >= 0 ? ni : 0;
    const avoCol = head.indexOf('avo'), tagCol = head.findIndex(x => ['tags', 'richting', 'richtingen'].includes(x));
    const dayCol = {}; DAYS.forEach(d => { const i = head.findIndex(x => x.startsWith(d)); if (i >= 0 && i !== nameCol) dayCol[d] = i; });
    for (const r of ts.rows.slice(hasHead ? 1 : 0)) {
      const nm = String(r[nameCol] ?? '').trim(); if (!nm) continue;
      let t = S.teachers.find(x => x.name.toLowerCase() === nm.toLowerCase());
      if (!t) { t = newTeacher(nm); S.teachers.push(t); nt++; }
      else if (!Object.keys(dayCol).length && avoCol < 0 && tagCol < 0) continue;
      DAYS.forEach(d => { if (dayCol[d] !== undefined) t.avail[d] = parseAv(r[dayCol[d]]); });
      if (tagCol >= 0) t.tags = String(r[tagCol] ?? '').split(/[\s,;]+/).map(x => TAGS.find(g => g.toLowerCase() === x.toLowerCase())).filter(Boolean);
      else if (avoCol >= 0) { const on = /^(ja|x|1|true)$/i.test(String(r[avoCol] ?? '').trim()); t.tags = on ? [...new Set([...t.tags, 'AVO'])] : t.tags.filter(g => g !== 'AVO'); }
    }
  }
  if (ks && ks.rows.length) {
    const head = ks.rows[0].map(x => String(x ?? '').toLowerCase().trim());
    const ci = n => head.findIndex(x => x.startsWith(n));
    const iN = Math.max(0, ci('naam')), iY = ci('jaar'), iP = ci('profiel');
    for (const r of ks.rows.slice(1)) {
      const nm = String(r[iN] ?? '').trim(); const y = iY >= 0 ? parseInt(r[iY]) : NaN; if (!nm || ![1, 2, 3].includes(y)) continue;
      let c = S.classes.find(x => x.year === y && x.name.toLowerCase() === nm.toLowerCase());
      if (!c) { const p = String(r[iP] ?? '').toUpperCase(); c = newClass(nm, y, PROFILES.includes(p) ? p : 'WEB'); S.classes.push(c); nc++; }
    }
  }
  return `Geïmporteerd: ${nt} nieuwe docent(en), ${nc} nieuwe klas(sen).`;
}

    { name: 'Docenten', rows: docs, widths: [26, 8, 8, 8, 8, 8, 8] }, { name: 'Klassen', rows: kl, widths: [18, 8, 12] }]);
